name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Build generated site data
        run: ruby scripts/generate_site_cv.rb

      - name: Compile CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: eb_cv_current.tex
          working_directory: CV/Ebraheem_CV
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Copy CV PDF to site root
        run: cp CV/Ebraheem_CV/eb_cv_current.pdf Ebraheem_Farag_CV.pdf

      - name: Assemble site
        run: ./scripts/assemble_dist.sh

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
